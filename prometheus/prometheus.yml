global:
  scrape_interval: 15s

scrape_configs:
  # Cisco router via snmp_exporter
  - job_name: snmp
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]          # SNMP v2c, community "public"
    static_configs:
      - targets:
          - 192.168.127.133      # R1
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: host.docker.internal:9116

  # snmp_exporter's own health metrics
  - job_name: snmp-exporter
    static_configs:
      - targets: ["host.docker.internal:9116"]
